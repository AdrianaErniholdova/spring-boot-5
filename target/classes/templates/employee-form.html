<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Formulár zamestnanca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-container">

  <main>

    <div class="page-heading">

      <div>
        <h1 th:text="${employee.id == null ? 'Nový zamestnanec' : 'Úprava zamestnanca'}">
          Nový zamestnanec
        </h1>
      </div>

      <a th:href="@{/employees}" class="btn btn-light">
        ← Späť na zoznam
      </a>

    </div>

    <div class="card form-card">

      <form th:action="@{/employees/save}"
            th:object="${employee}"
            method="post">

        <input type="hidden" th:field="*{id}">

        <div class="form-grid">

          <div class="form-group">
            <label>Meno</label>
            <input type="text"
                   th:field="*{firstName}"
                   class="form-control"
                   placeholder="Zadajte meno">
            <span class="error"
                  th:errors="*{firstName}"></span>
          </div>

          <div class="form-group">
            <label>Priezvisko</label>
            <input type="text"
                   th:field="*{lastName}"
                   class="form-control"
                   placeholder="Zadajte priezvisko">
            <span class="error"
                  th:errors="*{lastName}"></span>
          </div>

          <div class="form-group">
            <label>Dátum narodenia</label>

            <input type="date"
                   name="birthDate"
                   id="birthDate"
                   class="form-control"
                   th:value="${employee.birthDate != null ? #temporals.format(employee.birthDate, 'yyyy-MM-dd') : ''}">

            <span class="error"
                  th:errors="*{birthDate}"></span>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control"
                   placeholder="napr. meno@email.com">
            <span class="error"
                  th:errors="*{email}"></span>
          </div>

          <div class="form-group">
            <label>Telefónne číslo</label>
            <input type="tel"
                   th:field="*{phone}"
                   class="form-control"
                   placeholder="+421XXXXXXXXX">
            <span class="error"
                  th:errors="*{phone}"></span>
          </div>

          <div class="form-group">
            <label>Pracovná pozícia</label>

            <select th:field="*{jobTitle}"
                    class="form-control">

              <option value="">Vyberte pozíciu</option>

              <option th:each="job : ${jobTitles}"
                      th:value="${job}"
                      th:text="${job}">
              </option>

            </select>

            <span class="error"
                  th:errors="*{jobTitle}"></span>
          </div>

          <div class="form-group">
            <label>Plat (€)</label>
            <input type="number"
                   th:field="*{salary}"
                   class="form-control"
                   placeholder="Napr. 1500"
                   min="0"
                   step="0.01">
          </div>

        </div>

        <div class="form-group">
          <label>Typ pracovného pomeru</label>

          <div class="radio-group">

            <label class="radio-option"
                   th:each="type : ${fullTimeTypes}">

              <input type="radio"
                     th:field="*{fullTime}"
                     th:value="${type}">

              <span th:text="${type}"></span>

            </label>

          </div>

          <span class="error"
                th:errors="*{fullTime}"></span>
        </div>

        <div class="form-buttons">

          <button type="submit" class="btn btn-primary">
            Uložiť zamestnanca
          </button>

          <a th:href="@{/employees}" class="btn btn-light">
            Zrušiť
          </a>

        </div>

      </form>

    </div>

  </main>

</div>

</body>
</html>
